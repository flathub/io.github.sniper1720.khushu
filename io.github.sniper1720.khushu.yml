app-id: io.github.sniper1720.khushu
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
separate-locales: false
command: khushu
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=LOCPATH=/app/usr/lib/locale
modules:
  - name: khushu
    buildsystem: meson
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/khushu/cargo
        CARGO_NET_OFFLINE: "true"
        CARGO_BUILD_OFFLINE: "true"
        GETTEXT_SYSTEM: "1"
      config-opts:
        - -Dgenerate_locales=auto
    sources:
      - type: archive
        url: https://github.com/sniper1720/khushu/archive/refs/tags/v1.3.4.tar.gz
        sha256: 8d4149d86215b3957364b6a0d692af518db36aa0fbb4627458cbb7366e0dd97d
      - cargo-sources.json
